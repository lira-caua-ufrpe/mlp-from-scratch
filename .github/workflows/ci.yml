name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r code/mlp_viewer/requirements.txt
        pip install pytest
    
    - name: Run tests
      run: |
        python -m pytest code/mlp_viewer/tests/ -v
    
    - name: Check imports
      run: |
        python -c "
import sys
sys.path.insert(0, 'code/mlp_viewer')
from network import Network
from loader import Loader
print('Imports OK')
"
    
    - name: Quick training test
      run: |
        python -c "
import sys
sys.path.insert(0, 'code/mlp_viewer')
import numpy as np
from network import Network
X = np.random.randn(20, 3)
y = np.random.randint(0, 2, (20, 1))
mlp = Network([3, 8, 1])
mlp.set_activation('sigmoid')
mlp.fit(X, y, epochs=5, verbose=False)
print('Quick training OK')
"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install lint tools
      run: pip install flake8 black
    - name: Check formatting
      run: black --check code/mlp_viewer/ --exclude="spec-kit-main|mlp-main|.venv|venv|__pycache__|.pytest_cache"
    - name: Lint
      run: flake8 code/mlp_viewer/ --max-line-length=100 --ignore=E501,W503 --exclude=spec-kit-main,mlp-main,.venv,venv,__pycache__,.pytest_cache