name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v
    
    - name: Check imports
      run: |
        python -c "from src.mlp import MLP, ComputationalGraph; print('Imports OK')"
    
    - name: Quick training test
      run: |
        python -c "
        import numpy as np
        from src.mlp import MLP
        X = np.random.randn(20, 3)
        y = np.random.randint(0, 2, (20, 1))
        mlp = MLP([3, 8, 1], ['relu', 'sigmoid'], seed=42)
        mlp.fit(X, y, epochs=5, verbose=False)
        print('Quick training OK')
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install lint tools
      run: pip install flake8 black
    - name: Check formatting
      run: black --check . --exclude="spec-kit-main|mlp-main|.venv|venv|__pycache__|.pytest_cache"
    - name: Lint
      run: flake8 . --max-line-length=100 --ignore=E501,W503 --exclude=spec-kit-main,mlp-main,.venv,venv,__pycache__,.pytest_cache